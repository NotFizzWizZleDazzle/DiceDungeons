[project]
name = "Dice Dungeons"
organization = "Dinoglazers"
entry = "src/main.cdl"

[window]
width = 1920
height = 1080
scale_mode = "letterbox"

[physics]
gravity = [0, 2400]

[settings]

[dungeon]
variant_chance = 0.4
torches_per_chunk = 3     
torch_height = 0.75
[card]

[torches]
glow = false 
# ambient = { r = 0.32, g = 0.29, b = 0.36, a = 1.0 }

[input]
jump = ["key:W", "key:Space"]
left = ["key:A"]
right = ["key:D"]
down = ["key:S"]

[render]
backend = "webgpu"

[lighting]
enabled = true
[debug]
shown = false
