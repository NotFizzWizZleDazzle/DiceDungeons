[project]
name = "Dice Dungeons"
organization = "Dinoglazers"
entry = "src/main.cdl"

[window]
width = 1920
height = 1080
scale_mode = "letterbox"

[physics]
gravity = [0, 2400]

[dungeon]
torches_per_chunk = 3
torch_height = 0.75

[torches]
glow = false

[input]
jump = ["key:W", "key:Space"]
left = ["key:A"]
right = ["key:D"]
down = ["key:S"]

[render]
backend = "webgpu"

[lighting]
enabled = true

[debug]
shown = false

[enemy_ai]
difficulty = 1.0
